# Screenshot and app preview text per capture locale (the locales in
# screenshots.toml).
#
# The app preview video (`swpngx promo previews`) reuses slides 1-3 and ends
# on `video_end` under the app name.
#
# Each slide is two headline lines and a subtitle. `accent` ends the second
# line and is drawn in green; `line2` is the plain text before it. Lines that
# run long are shrunk to fit, but keep them short. Terms follow the app's own
# translations (AppShared/.../App.xcstrings), e.g. the word for "tags".

[en-US]
video_end = "The Paperless-ngx app for iPhone and iPad"
slides = [
  { line1 = "Your Paperless,", line2 = "in your ", accent = "pocket.", sub = "A native iOS app for Paperless-ngx" },
  { line1 = "Find anything,", line2 = "in ", accent = "seconds.", sub = "Filter by tag, type, correspondent and more" },
  { line1 = "Read and share,", line2 = "", accent = "anywhere.", sub = "Preview PDFs and send them to any app" },
  { line1 = "Keep it tidy,", line2 = "", accent = "on the go.", sub = "Edit tags, dates and correspondents" },
]

