<!doctype html>
<!--
  "Paper drift": ambient, seamlessly looping header for the App Store
  product page (3840×1646). Every animation repeats on a period that divides
  the 16 s loop, so frame 0 and frame 16 s are identical.

  ?t=<seconds> freezes the scene at that time.
  Run `render.py prepare` first to cut the phone screens into assets/.
-->
<html>
<head>
<meta charset="utf-8">
<title>Paper drift</title>
<style>
  html, body { margin: 0; background: #f4efe4; }
  svg { display: block; width: 3840px; height: 1646px; }

  /* Papers ride left → right across the canvas once per period */
  .drift { animation: drift var(--dur) linear var(--delay) infinite; }
  @keyframes drift {
    from { transform: translate(var(--x0), var(--y0)) rotate(var(--r0)) scale(var(--s)); }
    to   { transform: translate(var(--x1), var(--y1)) rotate(var(--r1)) scale(var(--s)); }
  }
  /* …and rock gently as they go (4 s alternate = 8 s cycle) */
  .sway { animation: sway 4s ease-in-out var(--sway-delay) infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-7deg) translateY(-18px); }
    to   { transform: rotate(7deg) translateY(18px); }
  }

  /* Ribbon undulates (8 s alternate = 16 s cycle) */
  #ribbon { animation: ribbon 8s ease-in-out infinite alternate; }
  #ribbon-hi { animation: ribbon-hi 8s ease-in-out infinite alternate; }
  @keyframes ribbon {
    from { d: path("M -300 1180 C 900 760, 1900 1560, 4140 960"); }
    to   { d: path("M -300 1020 C 1100 1480, 2300 700, 4140 1140"); }
  }
  @keyframes ribbon-hi {
    from { d: path("M -300 1010 C 900 590, 1900 1390, 4140 790"); }
    to   { d: path("M -300 850 C 1100 1310, 2300 530, 4140 970"); }
  }

  /* Phone floats (4 s alternate = 8 s cycle) */
  #phone-bob { animation: bob 4s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-36px); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 3840 1646" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.09 0"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#2b2414" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-far" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feDropShadow in="b" dx="0" dy="14" stdDeviation="18" flood-color="#2b2414" flood-opacity="0.16"/>
    </filter>
    <filter id="shadow-near" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feDropShadow in="b" dx="0" dy="40" stdDeviation="40" flood-color="#2b2414" flood-opacity="0.2"/>
    </filter>
    <!-- Pills are short, so the shadow needs a taller region than the papers' -->
    <filter id="shadow-pill" x="-40%" y="-80%" width="180%" height="320%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#2b2414" flood-opacity="0.22"/>
    </filter>
    <filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#14251a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="74" y="1002" width="1172" height="2400" rx="158"/>
    </clipPath>

    <!-- Tag pills, centred on origin -->
    <g id="pill-bank">
      <rect x="-150" y="-62" width="300" height="124" rx="62" fill="#c9cdf8" stroke="#3f4ed0" stroke-width="6"/>
      <text x="0" y="24" font-size="68" font-weight="600" fill="#262c8a" text-anchor="middle" font-family="-apple-system, sans-serif">Bank</text>
    </g>
    <g id="pill-inbox">
      <rect x="-150" y="-62" width="300" height="124" rx="62" fill="#ead0ef" stroke="#8e3fa3" stroke-width="6"/>
      <text x="0" y="24" font-size="68" font-weight="600" fill="#5e1f70" text-anchor="middle" font-family="-apple-system, sans-serif">Inbox</text>
    </g>
    <g id="pill-invoice">
      <rect x="-170" y="-62" width="340" height="124" rx="62" fill="#fde2c4" stroke="#d9781c" stroke-width="6"/>
      <text x="0" y="24" font-size="68" font-weight="600" fill="#8a4508" text-anchor="middle" font-family="-apple-system, sans-serif">Invoice</text>
    </g>
  </defs>

  <rect width="3840" height="1646" fill="#f4efe4"/>
  <rect width="3840" height="1646" filter="url(#grain)"/>

  <g id="layer-far"></g>

  <path id="ribbon-hi" fill="none" stroke="#2e7d32" stroke-width="44" opacity="0.5"
        d="M -300 1010 C 900 590, 1900 1390, 4140 790"/>
  <path id="ribbon" fill="none" stroke="#17541f" stroke-width="300"
        d="M -300 1180 C 900 760, 1900 1560, 4140 960"/>

  <g id="layer-mid"></g>

  <!-- Phone, tilted, rising from the bottom edge right of centre -->
  <g id="phone-bob">
    <g transform="translate(2560 230) rotate(-7) scale(.72) translate(-660 -980)">
      <rect x="52" y="980" width="1216" height="2440" rx="180" fill="#1b1d1b" filter="url(#phone-shadow)"/>
      <rect x="55" y="983" width="1210" height="2434" rx="177" fill="none" stroke="#9aa09a" stroke-width="6"/>
      <rect x="74" y="1002" width="1172" height="2400" rx="158" fill="#f6f6f6"/>
      <image href="../assets/screen_list.png" x="74" y="1002" width="1172" height="2218" clip-path="url(#screen-clip)"/>
    </g>
  </g>

  <g id="layer-near"></g>
</svg>
<script src="papers.js"></script>
<script>
  const LOOP = 16;
  window.__scene = { duration: LOOP, width: 3840, height: 1646 };

  // Deterministic layout: same seed, same scene.
  let seed = 7;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const between = (a, b) => a + rand() * (b - a);

  // period must divide LOOP; papers enter and leave fully off-canvas.
  const layers = [
    { id: "layer-far",  count: 9, period: LOOP,     scale: [0.26, 0.34], y: [80, 1560], filter: "shadow-far",
      kinds: ["letter", "invoice", "receipt"] },
    { id: "layer-mid",  count: 8, period: LOOP,     scale: [0.48, 0.6],  y: [150, 1500], filter: "shadow",
      kinds: ["letter", "invoice", "receipt", "pill-bank", "pill-inbox", "pill-invoice"] },
    { id: "layer-near", count: 2, period: LOOP / 2, scale: [1.1, 1.3],   y: [300, 1300], filter: "shadow-near",
      kinds: ["letter", "invoice"] },
  ];

  for (const layer of layers) {
    const parent = document.getElementById(layer.id);
    for (let i = 0; i < layer.count; i++) {
      const kind = layer.kinds[i % layer.kinds.length];
      const isPill = kind.startsWith("pill");
      const s = between(...layer.scale) * (isPill ? 1.4 : 1);
      const y0 = between(...layer.y);
      const r0 = between(-30, 30);
      const spin = between(25, 60) * (rand() < 0.5 ? -1 : 1);
      const reach = 500 * s + 80; // half-diagonal, so it is fully off-canvas
      const offset = (i + between(-0.25, 0.25)) / layer.count;

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "drift");
      g.setAttribute("filter", `url(#${isPill ? "shadow-pill" : layer.filter})`);
      g.style.cssText = `
        --dur: ${layer.period}s; --delay: ${(-offset * layer.period).toFixed(3)}s; --s: ${s.toFixed(3)};
        --x0: ${-reach}px; --x1: ${3840 + reach}px;
        --y0: ${y0.toFixed(0)}px; --y1: ${(y0 - between(80, 220)).toFixed(0)}px;
        --r0: ${r0.toFixed(1)}deg; --r1: ${(r0 + (isPill ? spin / 4 : spin)).toFixed(1)}deg;
        --sway-delay: ${(-between(0, 8)).toFixed(2)}s;`;
      g.innerHTML = `<g class="sway"><use href="#${isPill ? kind : "sym-" + kind}"/></g>`;
      parent.appendChild(g);
    }
  }

  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = parseFloat(t) * 1000; }
  }
</script>
</body>
</html>
