# http context: copy to /etc/nginx/conf.d/ on the Dokku host; the app's nginx.conf.sigil uses these zones.

# Per-client key: an IPv4 address as is, an IPv6 address by its /64, so rotating
# addresses within one allocation shares a limit. Best effort: an address whose
# first four groups nginx writes compressed (`::`) is keyed as a whole.
map $remote_addr $telemetry_client {
    "~^(?<prefix>([0-9a-f]{1,4}:){4})" $prefix;
    default $remote_addr;
}
limit_req_zone $telemetry_client zone=telemetry:1m rate=20r/m;

# One key for the whole server: caps total ingest however many addresses send.
limit_req_zone $server_name zone=telemetry_all:64k rate=300r/m;
