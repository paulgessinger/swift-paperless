[project]
name = "telemetry-collector"
version = "0.1.0"
description = "Counter-only telemetry collector for Swift Paperless"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.15",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.7",
    # Dashboard only (never imported by the collector role).
    "authlib>=1.9",
    "joserfc>=1.0",
    "httpx>=0.27",
    "itsdangerous>=2.2",
]

[project.scripts]
telemetry-report = "telemetry_collector.cli:main"
telemetry-collector-serve = "telemetry_collector.serve:main"

[dependency-groups]
dev = [
    "pytest>=8",
    # Signs ID tokens in the fake OIDC provider (also an Authlib runtime dependency).
    "cryptography>=43",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The httpx module is deprecated",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; tests use fixed fake secrets and URLs.
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportDeprecated = true
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
