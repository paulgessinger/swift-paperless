version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Batch all action bumps into a single PR.
    groups:
      github-actions:
        patterns:
          - "*"
    # Wait 7 days after a release before opening a PR for it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  - package-ecosystem: "swift"
    directories:
      - "/AppShared"
      - "/AppViews"
      - "/Common"
      - "/DataModel"
      - "/Networking"
      - "/Persistence"
      - "/Scanning"
    schedule:
      interval: "weekly"
    groups:
      swift:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"

  - package-ecosystem: "uv"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    groups:
      scripts:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
