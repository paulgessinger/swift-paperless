name: TestFlight

on:
  release:
    types: [prereleased]
jobs:
  # fastlane beta_ci pushes the build-number bump back to the repo using the
  # default GITHUB_TOKEN and its persisted checkout credentials, so this job
  # legitimately needs write access and persisted credentials.
  upload_to_testflight: # zizmor: ignore[excessive-permissions]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup git user
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Deploy to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSPHRASE }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eval `ssh-agent -s`
          ssh-add - <<< '${{ secrets.MATCH_DEPLOY_PRIVATE_KEY }}'
          fastlane beta_ci
