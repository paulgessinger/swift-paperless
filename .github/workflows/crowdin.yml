name: Crowdin synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '2 */12 * * *'
  push:
    paths: [
      'AppShared/Sources/AppShared/Resources/Localization/*.xcstrings',
      'swift-paperless/Localization/*.xcstrings',
    ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    name: Crowdin Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: '0.3.x'
          install-only: true

      - name: Crowdin push
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          command: push

      - name: Crowdin pull
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          command: pull

      - name: Fix generated files
        run: |
          # Catalog folders may not exist on every branch; skip unmatched globs.
          shopt -s nullglob
          catalogs=(AppShared/Sources/AppShared/Resources/Localization/*.xcstrings swift-paperless/Localization/*.xcstrings)
          sudo chown "$(whoami):$(whoami)" "${catalogs[@]}"
          prek run end-of-file-fixer --files "${catalogs[@]}" || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GH_TOKEN }}
          title: 'chore: Update localization'
          commit-message: 'chore: Update localization'
          branch: l18n_update
          delete-branch: true
          body: "Automated update of localizations from Crowdin"
          base: main
          add-paths: |
            AppShared/Sources/AppShared/Resources/Localization
            swift-paperless/Localization
