name: Crowdin synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '2 */12 * * *'
  push:
    paths: [
      'AppShared/Sources/AppShared/Resources/Localization/*.xcstrings',
      'swift-paperless/Localization/*.xcstrings',
    ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    name: Crowdin Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: '0.3.x'
          install-only: true

      - name: Crowdin push
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        with:
          command: push

      - name: Crowdin pull
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        with:
          command: pull

      - name: Fix generated files
        run: |
          # Catalog folders may not exist on every branch; skip unmatched globs.
          shopt -s nullglob
          catalogs=(AppShared/Sources/AppShared/Resources/Localization/*.xcstrings swift-paperless/Localization/*.xcstrings)
          sudo chown "$(whoami):$(whoami)" "${catalogs[@]}"
          prek run end-of-file-fixer --files "${catalogs[@]}" || true

      # The pull drops translations committed to the repo but never uploaded.
      # Put them back (Crowdin wins where both sides have one) and upload them.
      - name: Restore local-only translations
        id: restore
        run: |
          shopt -s nullglob
          python3 scripts/restore_local_translations.py --github-output \
            AppShared/Sources/AppShared/Resources/Localization/*.xcstrings \
            swift-paperless/Localization/*.xcstrings

      - name: Crowdin push translations
        if: steps.restore.outputs.restored != '0'
        uses: crowdin/github-action@9af557de76d70c480f88065d336f445a362f402b # v3.1.0
        with:
          command: push translations
          # Keep translations equal to the source (e.g. "Database"); Crowdin
          # rejects those by default and they'd be restored on every run.
          command_args: --import-eq-suggestions

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          title: 'chore: Update localization'
          commit-message: 'chore: Update localization'
          branch: l18n_update
          delete-branch: true
          body: "Automated update of localizations from Crowdin"
          base: main
          add-paths: |
            AppShared/Sources/AppShared/Resources/Localization
            swift-paperless/Localization
