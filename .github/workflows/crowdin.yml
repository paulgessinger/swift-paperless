name: Crowdin synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '2 */12 * * *'
  push:
    paths: [
      'AppShared/Sources/AppShared/Resources/Localization/*.xcstrings',
      'swift-paperless/Localization/*.xcstrings',
    ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    name: Crowdin Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.3.x'
          install-only: true

      - name: Crowdin push
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          command: push

      # The repo is the source of truth for translations: catalog edits that
      # land on main are uploaded and approved on Crowdin before the pull.
      - name: Decide whether to upload translations
        id: gate
        if: github.event_name == 'push'
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A merged sync PR only carries values that came from Crowdin.
          if [[ "$HEAD_MESSAGE" == "chore: Update localization"* ]]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # While a sync PR is open, Crowdin has translations main lacks;
          # uploading main's older values would overwrite them.
          pending=$(git ls-remote --heads origin l18n_update)
          if [[ -n "$pending" ]]; then
            echo "::notice::Skipping translation upload: l18n_update is pending"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Crowdin push translations
        if: steps.gate.outputs.upload == 'true'
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          command: push translations
          # Keep values equal to the source ("Scan"), and let repo edits
          # replace approved translations.
          command_args: --import-eq-suggestions --auto-approve-imported

      - name: Crowdin pull
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          command: pull

      - name: Fix generated files
        run: |
          # Catalog folders may not exist on every branch; skip unmatched globs.
          shopt -s nullglob
          catalogs=(AppShared/Sources/AppShared/Resources/Localization/*.xcstrings swift-paperless/Localization/*.xcstrings)
          sudo chown "$(whoami):$(whoami)" "${catalogs[@]}"
          prek run end-of-file-fixer --files "${catalogs[@]}" || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_TOKEN }}
          title: 'chore: Update localization'
          commit-message: 'chore: Update localization'
          branch: l18n_update
          delete-branch: true
          body: "Automated update of localizations from Crowdin"
          base: main
          add-paths: |
            AppShared/Sources/AppShared/Resources/Localization
            swift-paperless/Localization
