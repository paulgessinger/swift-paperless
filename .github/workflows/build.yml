name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.macos }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - macos: macos-26
            ios: "26.2"
            xcode: default
      fail-fast: false
    name: "iOS ${{ matrix.ios }} (Xcode ${{ matrix.xcode }}, ${{ matrix.macos }})"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: |
          if [ "${{ matrix.xcode }}" = "default" ]; then
            echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.xcode }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ steps.xcode-version.outputs.version }}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache SwiftPM sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('**/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-xcode-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild -showdestinations -scheme swift-paperless -project ./swift-paperless.xcodeproj
          xcodebuild build \
            -scheme swift-paperless \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=${{ matrix.ios }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

  test:
    name: "swift tests ${{ matrix.package }}"
    runs-on: macos-26
    timeout-minutes: 25

    strategy:
      matrix:
        package:
          - DataModel
          - Common
          - Networking

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ steps.xcode-version.outputs.version }}"

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ matrix.package }}-

      - name: Show resolved dependencies
        run: swift package show-dependencies --package-path ${{ matrix.package }}

      - name: Run ${{ matrix.package }} tests
        run: swift test --package-path ${{ matrix.package }} --jobs 4

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
        with:
          prek-version: '0.3.x'
