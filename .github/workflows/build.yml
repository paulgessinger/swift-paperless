name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.macos }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - macos: xcode-27
            ios: "27.0"
            xcode: default
      fail-fast: false
    name: "iOS ${{ matrix.ios }} (Xcode ${{ matrix.xcode }}, ${{ matrix.macos }})"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: |
          if [ "${{ matrix.xcode }}" = "default" ]; then
            echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.xcode }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ steps.xcode-version.outputs.version }}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache SwiftPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('**/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-xcode-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme swift-paperless \
            -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=${{ matrix.ios }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

  test:
    name: "swift tests ${{ matrix.package }}"
    runs-on: xcode-27
    timeout-minutes: 25

    strategy:
      matrix:
        package:
          - DataModel
          - Common
          - Networking
          - Persistence
          - Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ steps.xcode-version.outputs.version }}"

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ matrix.package }}-

      - name: Show resolved dependencies
        run: swift package show-dependencies --package-path ${{ matrix.package }}

      - name: Run ${{ matrix.package }} tests
        run: swift test --package-path ${{ matrix.package }} --jobs 4

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prek builds swift-format against the runner's Swift toolchain, and the
      # binary misbehaves once the image ships a newer Swift. prek-action's own
      # cache key ignores the toolchain, so cache the hooks here instead.
      - name: Read Swift version
        id: swift-version
        run: echo "hash=$(swift --version 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache prek hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-version.outputs.hash }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: '0.3.x'
          cache: false

  # The only check branch protection requires. The other job names embed matrix
  # values (iOS/Xcode/runner versions) that change with every toolchain bump;
  # gating on this one job keeps the required-check list stable. `always()` is
  # needed so a failed dependency fails this job instead of skipping it, which
  # GitHub would count as passing.
  all-green:
    name: CI
    if: always()
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
