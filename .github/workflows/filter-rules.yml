name: Check upstream filter rule types

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_filter_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # For gh cli in generate_filterrules.py
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
        with:
          prek-version: '0.3.x'
          install-only: true

      - name: Generate filter rules
        run: |
          uv run scripts/generate_filterrules.py --output DataModel/Sources/DataModel/FilterRuleType.swift
          prek run swift-format --files DataModel/Sources/DataModel/FilterRuleType.swift || true

      - run: git diff

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          title: 'chore: Update Filter Rule types'
          commit-message: 'chore: Update Filter Rule types'
          branch: filter-rule-type-update
          delete-branch: true
          body: "Automated update of Filter Rule types."
          base: main
          add-paths: DataModel/Sources/DataModel/FilterRuleType.swift
